name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and optional test dependencies
        # Keep the frozen package metadata unchanged; Phase E needs SciPy statistics.
        run: python -m pip install -e '.[all]' 'scipy==1.15.3'
      - name: Run complete test suite
        run: python -m unittest discover -s tests
